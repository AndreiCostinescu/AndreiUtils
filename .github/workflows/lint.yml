name: Lint

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    # Prebuilt image with cmake/clang-format/clang-tidy and every optional
    # dependency already installed - see .github/docker/Dockerfile and the
    # "CI Docker image" section in README.md.
    container:
      image: ghcr.io/andreicostinescu/andreiutils-ci:latest
    permissions:
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Check formatting (clang-format)
        run: |
          clang-format --dry-run --Werror \
            $(git ls-files '*.h' '*.hpp' '*.hh' '*.hxx' '*.c' '*.cc' '*.cpp' '*.cxx')

      # Build with every optional module enabled so all source files (core +
      # eigen + opencv + realsense) are present in compile_commands.json for
      # clang-tidy.
      - name: Configure AndreiUtils
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DWITH_EIGEN=ON
          -DWITH_JSON=ON
          -DWITH_OPENMP=ON
          -DWITH_PTHREAD=ON
          -DWITH_OPENCV=ON
          -DWITH_REALSENSE=ON
          -DWITH_PCL_OPTIMIZATION_FLAGS=OFF
          -DWITH_TESTS=ON

      - name: Run clang-tidy
        run: clang-tidy -p build $(git ls-files '*.c' '*.cc' '*.cpp' '*.cxx')

name: Lint

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    # Prebuilt image with cmake/clang-format/clang-tidy and every optional
    # dependency already installed - see .github/docker/Dockerfile and the
    # "CI Docker image" section in README.md.
    container:
      image: ghcr.io/andreicostinescu/andreiutils-ci:latest
    permissions:
      packages: read

    steps:
      - uses: actions/checkout@v4

      - name: Configure Git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Check formatting (clang-format)
        uses: AndreiCostinescu/DevTools/.github/actions/check-clang-format@b8dc86cf13325c0fad39ca464876b91c78779b6e

      # Build with every optional module enabled so all source files (core +
      # eigen + opencv + realsense + python) are present in compile_commands.json
      # for clang-tidy.
      - name: Configure AndreiUtils
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DWITH_EIGEN=ON
          -DWITH_JSON=ON
          -DWITH_OPENMP=ON
          -DWITH_PTHREAD=ON
          -DWITH_OPENCV=ON
          -DWITH_REALSENSE=ON
          -DWITH_PYTHON=ON
          -DWITH_PCL_OPTIMIZATION_FLAGS=OFF
          -DWITH_TESTS=ON

      - name: Run clang-tidy
        uses: AndreiCostinescu/DevTools/.github/actions/run-clang-tidy@b8dc86cf13325c0fad39ca464876b91c78779b6e

name: CI image

# Builds (and, on main, publishes) the CI container image defined in
# .github/docker/Dockerfile - the image ci.yml and lint.yml run inside so
# their matrix jobs don't each re-run apt-get for every dependency.
#
# - Pull requests that touch the Dockerfile: build only, to catch breakage,
#   without pushing (a forked-PR run has no package-write access anyway).
# - Pushes to main that touch the Dockerfile: build and push
#   ghcr.io/andreicostinescu/andreiutils-ci:latest and :<sha>.
# - workflow_dispatch: build and push from any branch/ref - use this to test
#   a Dockerfile change from a feature branch before merging it (see the
#   "CI Docker image" section in README.md).

on:
  push:
    branches: ["main"]
    paths: [".github/docker/Dockerfile"]
  pull_request:
    paths: [".github/docker/Dockerfile"]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/andreicostinescu/andreiutils-ci

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .github/docker/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
